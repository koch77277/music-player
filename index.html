<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Music">
  <title>Music Player</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    :root {
      --bg: #000;
      --card: #1c1c1e;
      --text: #fff;
      --secondary: #8e8e93;
      --accent: #0a84ff;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }
    .app { height: 100%; display: flex; flex-direction: column; }
    .screen { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 140px; }
    .tab-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(28,28,30,0.85);
      backdrop-filter: blur(20px);
      display: flex; justify-content: space-around;
      padding: 8px 0 calc(8px + var(--safe-bottom));
      border-top: 0.5px solid #333;
      z-index: 100;
    }
    .tab {
      display: flex; flex-direction: column; align-items: center;
      font-size: 10px; color: var(--secondary); gap: 4px;
      background: none; border: none; color: var(--secondary);
    }
    .tab.active { color: var(--accent); }
    .tab svg { width: 24px; height: 24px; }
    .mini-player {
      position: fixed; bottom: 60px; left: 12px; right: 12px;
      background: rgba(40,40,42,0.9);
      backdrop-filter: blur(20px);
      border-radius: 14px;
      padding: 10px 14px;
      display: none;
      align-items: center; gap: 12px;
      z-index: 90;
    }
    .mini-player.visible { display: flex; }
    .track-item, .list-item {
      background: var(--card); border-radius: 12px; padding: 14px;
      margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
    }
    input, button.primary {
      width: 100%; padding: 14px; border-radius: 12px; border: none;
      font-size: 17px; margin-bottom: 12px;
    }
    input { background: #2c2c2e; color: white; }
    button.primary { background: var(--accent); color: white; font-weight: 600; }
    h1 { font-size: 34px; font-weight: 700; margin-bottom: 16px; }
    .auth { padding: 40px 24px; text-align: center; }
    .progress { height: 4px; background: #333; border-radius: 2px; margin: 8px 0; }
    .progress-bar { height: 100%; background: var(--accent); border-radius: 2px; width: 0%; }
  </style>
</head>
<body>
  <div id="app" class="app">
    <!-- Auth / Main screens injected by JS -->
  </div>

  <div id="miniPlayer" class="mini-player">
    <div style="flex:1">
      <div id="miniTitle" style="font-weight:600;font-size:15px"></div>
      <div id="miniArtist" style="font-size:13px;color:#8e8e93"></div>
      <div class="progress"><div id="miniProgress" class="progress-bar"></div></div>
    </div>
    <button id="miniPlay" style="background:none;border:none;color:white;font-size:22px">▶</button>
  </div>

  <div class="tab-bar" id="tabBar" style="display:none">
    <button class="tab active" data-tab="tracks">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      Треки
    </button>
    <button class="tab" data-tab="albums">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
      Альбомы
    </button>
    <button class="tab" data-tab="playlists">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"/></svg>
      Плейлисты
    </button>
    <button class="tab" data-tab="stats">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg>
      Статистика
    </button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
